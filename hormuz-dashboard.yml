name: Deploy Hormuz Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hormuz-dashboard-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure writable data file
        run: |
          if [ -L hormuz-flow-data.js ]; then
            rm hormuz-flow-data.js
          fi

      - name: Refresh dashboard data
        run: python3 refresh_hormuz_flow_dashboard.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- hormuz-flow-data.js; then
            git add hormuz-flow-data.js
            git commit -m "chore: refresh Hormuz dashboard data"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No data changes to commit."
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp hormuz-flow-dashboard.html site/index.html
          cp hormuz-flow-data.js site/hormuz-flow-data.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
